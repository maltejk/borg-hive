services:
  db:
    image: mariadb:10.5
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=borghive
      - MYSQL_USER=borghive
      - MYSQL_PASSWORD=borghive
      - MYSQL_RANDOM_ROOT_PASSWORD=1

  app:
    build:
      context: .
      dockerfile: Dockerfile.base
    command: ./manage.py runserver 0.0.0.0:8000
    environment:
      - DEBUG=True
      - MYSQL_HOST=db
      - MYSQL_DATABASE=borghive
      - MYSQL_USER=borghive
      - MYSQL_PASSWORD=borghive
      - BORGHIVE_ADMIN_PASSWORD=login
    env_file:
      - .env
      - .dev
    volumes:
      - borg-config:/config
      - borg-repos:/repos
      - extrausers-data:/var/lib/extrausers
      - static:/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      - db

  worker:
    build:
      context: .
      dockerfile: Dockerfile.base
    command: celery -A core worker -l DEBUG -B --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DEBUG=True
      - MYSQL_HOST=db
      - MYSQL_DATABASE=borghive
      - MYSQL_USER=borghive
      - MYSQL_PASSWORD=borghive
    env_file:
      - .env
      - .dev
    volumes:
      - borg-config:/config
      - borg-repos:/repos:ro
      - extrausers-data:/var/lib/extrausers
    depends_on:
      - db

  watcher:
    build:
      context: .
      dockerfile: Dockerfile.base
    command: ./manage.py watch_repositories
    environment:
      - APP_LOG_LEVEL=DEBUG
      - MYSQL_HOST=db
      - MYSQL_DATABASE=borghive
      - MYSQL_USER=borghive
      - MYSQL_PASSWORD=borghive
    restart: 'on-failure'
    volumes:
      - borg-repos:/repos:ro
    depends_on:
      - db

  borg:
    build:
      context: .
      dockerfile: Dockerfile.borg
    depends_on:
      - db
    environment:
      - DEBUG=True
      - MYSQL_HOST=db
      - MYSQL_DATABASE=borghive
      - MYSQL_USER=borghive
      - MYSQL_PASSWORD=borghive
    volumes:
      - borg-repos:/repos
      - borg-config:/config
      - extrausers-data:/var/lib/extrausers:ro
    ports:
      - "22:22"

  redis:
    image: redis:6.2.19-bookworm

volumes:
  mariadb-data:
  borg-repos:
  borg-config:
  extrausers-data:
  static:
